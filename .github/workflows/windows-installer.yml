name: Desktop installers

on:
  push:
    branches: [realese]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            executable: RevEx.Desktop.exe
          - os: macos-15-intel
            rid: osx-x64
            executable: RevEx.Desktop
          - os: macos-15
            rid: osx-arm64
            executable: RevEx.Desktop
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Set build version
        run: '"APP_VERSION=1.0.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_ENV'
      - name: Install packaging tool
        run: dotnet tool install --global vpk --version 1.2.161
      - name: Verify startup update decisions
        run: |
          dotnet run --project tests/StartupUpdateChecks/StartupUpdateChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish desktop
        run: |
          dotnet publish RevEx.Desktop/RevEx.Desktop.csproj -c Release `
            -r '${{ matrix.rid }}' --self-contained true `
            -p:Version=$env:APP_VERSION -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package installer and full update
        run: |
          # Windows IL verification does not follow calls into the Updates assembly.
          # Program.Main calls DesktopUpdates.Initialize before Avalonia or the instance lock.
          if ('${{ runner.os }}' -eq 'Windows') {
            $env:VPK_SKIP_VELO_APP_CHECK = 'true'
          }
          vpk pack --packId RevEx.Desktop --packTitle RevEx `
            --packVersion $env:APP_VERSION --packDir artifacts/publish `
            --mainExe '${{ matrix.executable }}' --runtime '${{ matrix.rid }}' `
            --channel '${{ matrix.rid }}' --outputDir artifacts/releases `
            --releaseNotes packaging/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer payload
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pkgutil --payload-files "artifacts/releases/RevEx.Desktop-${{ matrix.rid }}-Setup.pkg" | grep 'RevEx.app/Contents/MacOS/RevEx.Desktop$'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}-${{ env.APP_VERSION }}
          path: artifacts/releases/*
          if-no-files-found: error
          retention-days: 90
      - name: Create platform upload archive
        run: ./packaging/create-release-archive.ps1 -Version $env:APP_VERSION -Platforms '${{ matrix.rid }}' -InputDirectory artifacts/releases
      - uses: actions/upload-artifact@v4
        with:
          name: RevEx-Desktop-${{ matrix.rid }}-${{ env.APP_VERSION }}
          path: artifacts/RevEx-Desktop-Release-*.zip
          if-no-files-found: error
          retention-days: 90
