name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.0.0 (without v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Version must have the format 1.2.3' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            executable: RevEx.Desktop.exe
          - os: macos-15-intel
            rid: osx-x64
            executable: RevEx.Desktop
          - os: macos-15
            rid: osx-arm64
            executable: RevEx.Desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install packaging tool
        run: dotnet tool install --global vpk --version 1.2.161
      - name: Publish desktop
        run: >-
          dotnet publish RevEx.Desktop/RevEx.Desktop.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ needs.version.outputs.version }}
          -o artifacts/publish
      - name: Package installer and update feed
        run: >-
          vpk pack --packId RevEx.Desktop --packTitle RevEx
          --packVersion ${{ needs.version.outputs.version }}
          --packDir artifacts/publish --mainExe ${{ matrix.executable }}
          --runtime ${{ matrix.rid }} --channel ${{ matrix.rid }}
          --outputDir artifacts/releases
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/releases/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Create draft release with all platforms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          mapfile -d '' files < <(find artifacts -type f ! -name 'assets.*.json' -print0)
          gh release create "v$RELEASE_VERSION" "${files[@]}" \
            --draft --title "RevEx $RELEASE_VERSION" \
            --target "$RELEASE_COMMIT" --generate-notes
