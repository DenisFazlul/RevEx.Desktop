<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560">
  <style>
    text { font-family: Inter, Arial, sans-serif; fill:#2D2D2D }
    .h2 { font-size:20px; font-weight:650 }
    .body { font-size:14px }
    .small { font-size:12px; fill:#6B6B6B }
    .button { font-size:12px; font-weight:600 }
  </style>
  <rect width="680" height="560" rx="12" fill="#FFFFFF" stroke="#D4D4D4"/>
  <text x="24" y="37" class="h2">Фильтр каталога</text>
  <text x="24" y="61" class="small">Выберите категории и теги материалов, которые нужно показать</text>

  <g transform="translate(24 86)">
    <rect width="308" height="390" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="18" y="31" class="body" font-weight="600">Категории</text>
    <text x="18" y="51" class="small">Можно выбрать несколько</text>
    <g class="body">
      <rect x="18" y="78" width="16" height="16" rx="4" fill="#111111"/><path d="M22 86l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.8"/>
      <text x="46" y="91">Архитектура</text>
      <rect x="18" y="116" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#AFAFAF"/><text x="46" y="129">Конструкции</text>
      <rect x="18" y="154" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#AFAFAF"/><text x="46" y="167">Инженерные системы</text>
      <rect x="18" y="192" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#AFAFAF"/><text x="46" y="205">Документация</text>
    </g>
  </g>

  <g transform="translate(348 86)">
    <rect width="308" height="390" rx="12" fill="#FFFFFF" stroke="#E5E5E5"/>
    <text x="18" y="31" class="body" font-weight="600">Теги</text>
    <text x="18" y="51" class="small">Материал должен содержать все выбранные теги</text>
    <g class="body">
      <rect x="18" y="78" width="16" height="16" rx="4" fill="#111111"/><path d="M22 86l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.8"/>
      <text x="46" y="91">revit</text>
      <rect x="18" y="116" width="16" height="16" rx="4" fill="#111111"/><path d="M22 124l3 3 6-7" fill="none" stroke="#fff" stroke-width="1.8"/>
      <text x="46" y="129">bim</text>
      <rect x="18" y="154" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#AFAFAF"/><text x="46" y="167">family</text>
      <rect x="18" y="192" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#AFAFAF"/><text x="46" y="205">документы</text>
    </g>
  </g>

  <path d="M0 494H680" stroke="#E5E5E5"/>
  <rect x="24" y="508" width="91" height="38" rx="9" fill="#FFFFFF" stroke="#D4D4D4"/>
  <text x="69.5" y="532" class="button" text-anchor="middle">Сбросить</text>
  <rect x="463" y="508" width="86" height="38" rx="9" fill="#FFFFFF" stroke="#D4D4D4"/>
  <text x="506" y="532" class="button" text-anchor="middle">Отмена</text>
  <rect x="559" y="508" width="97" height="38" rx="9" fill="#111111"/>
  <text x="607.5" y="532" class="button" text-anchor="middle" fill="#FFFFFF">Применить</text>
