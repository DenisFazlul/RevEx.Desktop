<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Авторизация завершена — RevEx</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1a1918;
            color: #faf6ef;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 15% 15%, rgba(255, 171, 53, .28), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(117, 69, 29, .18), transparent 32%),
                #1a1918;
        }

        .card {
            width: min(100%, 840px);
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            overflow: hidden;
            border: 1px solid rgba(185, 178, 169, .18);
            border-radius: 24px;
            background: rgba(36, 35, 33, .94);
            box-shadow: 0 28px 80px rgba(0, 0, 0, .38);
            backdrop-filter: blur(18px);
        }

        .illustration {
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(ellipse, rgba(255, 171, 53, .22), transparent 75%), #1a1918;
        }

        .content {
            align-self: center;
            padding: 40px;
        }

        .mascot {
            display: block;
            width: min(100%, 320px);
            height: auto;
        }

        .status {
            width: 32px;
            height: 32px;
            margin: 0 0 16px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #166534;
            box-shadow: 0 12px 32px rgba(22, 101, 52, .28);
            font-size: 18px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(26px, 5vw, 34px);
            line-height: 1.15;
        }

        p {
            margin: 0 0 28px;
            color: #b9b2a9;
            font-size: 16px;
            line-height: 1.6;
        }

        button {
            width: 100%;
            padding: 14px 22px;
            border: 0;
            border-radius: 12px;
            background: #ffab35;
            color: #242321;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(255, 171, 53, .3);
            transition: transform .15s ease, filter .15s ease;
        }

        button:hover { filter: brightness(1.1); transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button:focus-visible { outline: 3px solid rgba(255, 171, 53, .55); outline-offset: 3px; }

        .hint {
            min-height: 20px;
            margin-top: 16px;
            color: #b9b2a9;
            font-size: 13px;
        }
        @media (max-width: 640px) {
            body { padding: 16px; }
            .card { grid-template-columns: minmax(0, 1fr); }
            .mascot { width: 160px; }
            .content { padding: 28px 22px; }
        }
    </style>
</head>
<body>
<main class="card">
    <div class="illustration">
        <img class="mascot" src="data:image/png;base64,{{TYUBIK_PNG}}" width="178" height="151" alt="">
    </div>
    <div class="content">
        <div class="status" aria-hidden="true">✓</div>
        <h1>Авторизация завершена</h1>
        <p>Вы успешно вошли в RevEx. Вернитесь в приложение после закрытия этой вкладки.</p>
        <button id="close-button" type="button" onclick="closePage()">Закрыть вкладку</button>
        <div class="hint" id="hint" aria-live="polite"></div>
    </div>
</main>
<script>
    function closePage() {
        const button = document.getElementById('close-button');
        const hint = document.getElementById('hint');

        // Browsers may only allow scripts to close windows opened by another script.
        // The _self call still works in some Safari versions, so try it before showing
        // the platform-specific manual fallback.
        window.open('', '_self');
        window.close();

        window.setTimeout(() => {
            const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform) ||
                /Mac OS X/.test(navigator.userAgent);
            hint.textContent = isMac
                ? 'Safari запретил автоматическое закрытие. Нажмите ⌘W.'
                : 'Браузер запретил автоматическое закрытие. Нажмите Ctrl+W.';
            button.textContent = 'Закройте вкладку вручную';
            button.disabled = true;
        }, 250);
    }
</script>
</body>
</html>
